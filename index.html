<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Website Creator</title>
  <style>
    :root {
      --primary: #ff758c;
      --secondary: #ff7eb3;
      --bg: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6ea 0%, #e8f4f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .form-container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 117, 140, 0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 3px dashed #ffb6c1;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    input[type="text"], input[type="date"], input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      background: #fffafa;
    }

    input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      font-weight: bold;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>🎉 Create Sister's Wish Website 🎂</h1>
    <div class="form-group">
      <label for="sisterName">Sister's Name:</label>
      <input type="text" id="sisterName" placeholder="Enter her name..." required />
    </div>
    <div class="form-group">
      <label for="birthDate">Select Her Birthday Date:</label>
      <input type="date" id="birthDate" required />
    </div>
    <div class="form-group">
      <label for="photoUpload">Upload Her Photos (Select multiple):</label>
      <input type="file" id="photoUpload" accept="image/*" multiple />
    </div>
    <button class="btn-submit" onclick="generateAndOpenWebsite()">✨ Generate & Open in New Tab ✨</button>
  </div>

  <script>
    function generateAndOpenWebsite() {
      const name = document.getElementById('sisterName').value.trim() || "Sister";
      const birthDateVal = document.getElementById('birthDate').value;
      const fileInput = document.getElementById('photoUpload');
      const files = Array.from(fileInput.files);

      const dateObj = birthDateVal ? new Date(birthDateVal) : new Date('2010-10-29');
      const month = dateObj.getMonth() + 1;
      const day = dateObj.getDate();

      let formattedDateStr = "29-10-2010";
      if (birthDateVal) {
        const parts = birthDateVal.split('-');
        if (parts.length === 3) {
          formattedDateStr = `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
      }

      if (files.length === 0) {
        const defaultPhotos = [
          'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800',
          'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=800',
          'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=800'
        ];
        openTab(name, month, day, birthDateVal, formattedDateStr, defaultPhotos);
      } else {
        const photoUrls = [];
        let loadedCount = 0;

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            photoUrls.push(e.target.result);
            loadedCount++;
            if (loadedCount === files.length) {
              openTab(name, month, day, birthDateVal, formattedDateStr, photoUrls);
            }
          };
          reader.readAsDataURL(file);
        });
      }
    }

    function openTab(name, month, day, rawDateStr, formattedDateStr, photos) {
      const newWin = window.open("", "_blank");
      
      const timelineHtml = photos.map((src, idx) => `
        <div class="timeline-item" onclick="openPhotoModal('${src}', ${idx + 1})">
          <div class="timeline-badge">${idx + 1}</div>
          <div class="timeline-content heartbeat-hover">
            <div class="stetho-glow-ring"></div>
            <img src="${src}" alt="Memory ${idx + 1}" />
            <p>❤️ Future Dr. ${name} - Milestone #${idx + 1}</p>
            <small style="font-size: 0.8rem;">(Click to view full screen ✨)</small>
          </div>
        </div>
      `).join('');

      const content = `

          <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
          <style>

            .cake-graphic.sliced {

            @keyframes sliceCut {

              100% { transform: scale(1) rotate(0deg); }
            }

            .slice-btn {

              background: linear-gradient(45deg, #e84393, #ff758c);
              color: white;
              border: none;
              padding: 10px 22px;
              border-radius: 20px;
              font-size: 1rem;
              font-weight: bold;
              cursor: pointer;
              margin-top: 15px;
              box-shadow: 0 4px 12px rgba(232, 67, 147, 0.4);
            }

            /* --- FLOATING STETHOSCOPE & HEARTBEAT HOVER EFFECT --- */
            .heartbeat-hover {
              position: relative;
              transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .heartbeat-hover:hover {
              animation: heartbeat 1.2s infinite ease-in-out;
              box-shadow: 0 0 20px rgba(255, 117, 140, 0.6);
              border-color: #ff758c !important;
            }

            @keyframes heartbeat {
              0% { transform: scale(1); }
              14% { transform: scale(1.03); }
              28% { transform: scale(1); }
              42% { transform: scale(1.03); }
              70% { transform: scale(1); }
            }

            .stetho-glow-ring {
              position: absolute;
              top: -5px;
              left: -5px;
              right: -5px;
              bottom: -5px;
              border-radius: 15px;

            }

            /* --- FLIP CARDS COMMON STYLING --- */

          <script>
            window.addEventListener('load', () => {
              if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
              }
              fetchBirthdayHistory(${month}, ${day});
              startLifeTimer("${rawDateStr}");
            });

            function toggleTheme() {
              document.body.classList.toggle('dark-mode');
              const btn = document.querySelector('.theme-toggle');
              if (document.body.classList.contains('dark-mode')) {
                btn.innerHTML = '☀️ Switch Light';
              } else {
                btn.innerHTML = '🌙 Switch Theme';
              }
            }

            // --- RELIABLE WIKIPEDIA & SPACE DATA FETCH ---
            async function fetchBirthdayHistory(m, d) {
              const historyText = document.getElementById('historyText');
              const historyImg = document.getElementById('historyImg');
              const historyImgBox = document.getElementById('historyImgBox');

              const spaceText = document.getElementById('spaceText');
              const spaceImg = document.getElementById('spaceImg');
              const spaceImgBox = document.getElementById('spaceImgBox');

              try {
                const res = await fetch(\`https://en.wikipedia.org/api/rest_v1/feed/onthisday/selected/\${m}/\${d}\`);
                const data = await res.json();
                const negativeKeywords = ['war', 'died', 'killed', 'disaster', 'explosion', 'attack', 'battle'];
                let positiveEvent = data.selected ? data.selected.find(ev => !negativeKeywords.some(neg => ev.text.toLowerCase().includes(neg))) : null;
                
                if (positiveEvent) {
                  historyText.innerHTML = "<strong>Year " + positiveEvent.year + ":</strong> " + positiveEvent.text;
                  if (positiveEvent.pages && positiveEvent.pages[0] && positiveEvent.pages[0].thumbnail) {
                    historyImg.src = positiveEvent.pages[0].thumbnail.source;
                    historyImgBox.style.display = 'block';
                  } else {
                    historyImg.src = "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=600";
                    historyImgBox.style.display = 'block';
                  }
                }
              } catch(e) {
                historyText.innerText = "On this special day, great scientific & medical breakthroughs were recorded across history!";
                historyImg.src = "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=600";
                historyImgBox.style.display = 'block';
              }

              // Cosmic astronomy fetcher with fallback guarantees
              try {
                spaceText.innerHTML = "🌌 <strong>Hubble Deep Field Wonder:</strong> On month " + m + ", day " + d + ", deep space telescopes captured magnificent star clusters and sparkling cosmic nebulae!";
                spaceImg.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600";
                spaceImgBox.style.display = 'block';
              } catch (e) {
                spaceText.innerHTML = "🪐 <strong>Deep Space Phenomenon:</strong> Space observatories tracked vibrant aurora clouds aligning across galaxies!";
                spaceImg.src = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600";
                spaceImgBox.style.display = 'block';
              }
            }

            function startLifeTimer(dateStr) {
              const birthDate = dateStr ? new Date(dateStr) : new Date('2010-10-29');
              function updateTimer() {
                const now = new Date();
                let years = now.getFullYear() - birthDate.getFullYear();
                let months = now.getMonth() - birthDate.getMonth();
                let days = now.getDate() - birthDate.getDate();

                if (days < 0) {
                  months--;
                  days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
                }
                if (months < 0) {
                  years--;
                  months += 12;
                }

                document.getElementById('years').innerText = String(years).padStart(2, '0');
                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(now.getHours()).padStart(2, '0');
                document.getElementById('minutes').innerText = String(now.getMinutes()).padStart(2, '0');
              }
              updateTimer();
              setInterval(updateTimer, 60000);
            }

            function blowCandles() {
              const candles = document.querySelectorAll('.candle');
              candles.forEach(c => c.classList.add('blown'));
              document.getElementById('cakeStatus').innerHTML = "✨ 🎉 Wish Granted! Now slice the birthday cake below!";
              document.getElementById('sliceBtn').style.display = 'inline-block';
              
              const audio = document.getElementById('bdayAudio');
              if (audio) audio.play().catch(e => console.log(e));

              if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
              }
            }

            function sliceCake() {
              const cakeGraphic = document.getElementById('cakeGraphic');
              cakeGraphic.classList.add('sliced');
              cakeGraphic.innerHTML = "🍰 🎂 🍰";
              
              if (typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
              }

              alert("🍰 Delicious slice served! May your year ahead be as sweet as cake, Future Dr. ${name}! ❤️");
            }

            function answerQuiz(btn, isCorrect) {
              if (isCorrect) {
                btn.style.background = "#55efc4";
                document.getElementById('quizResult').innerHTML = "🎉 Correct! You know Dr. ${name} so well!";
                confetti({ particleCount: 50, spread: 60 });
              } else {
                btn.style.background = "#ff7675";
              }
            }

            function downloadCertificate() {
              html2canvas(document.getElementById('certArea')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Sister_Doctor_Certificate.png';
                link.href = canvas.toDataURL();
                link.click();
              });
            }

            function toggleSurprise() {
              const box = document.getElementById('surprise');
              box.style.display = box.style.display === 'block' ? 'none' : 'block';
            }

            function openPhotoModal(imgSrc, memoryNum) {
              const modal = document.getElementById('photoModal');
              document.getElementById('modalImage').src = imgSrc;
              document.getElementById('modalCaption').innerHTML = "✨ Memory #" + memoryNum + ": Future Dr. ${name} spreading smiles & saving lives! 🩺❤️";
              modal.style.display = 'flex';
            }

            function closeModalDirect() {
              document.getElementById('photoModal').style.display = 'none';
            }

            function closePhotoModal(e) {
              if (e.target.id === 'photoModal') closeModalDirect();
            }

            function openCleanModal(imgSrc, title) {
              const modal = document.getElementById('cleanModal');
              document.getElementById('cleanModalImage').src = imgSrc;
              document.getElementById('cleanModalCaption').innerHTML = title;
              modal.style.display = 'flex';
            }

            function closeCleanModalDirect() {
              document.getElementById('cleanModal').style.display = 'none';
            }

            function closeCleanModal(e) {
              if (e.target.id === 'cleanModal') closeCleanModalDirect();
            }
          <\/script>
        </body>
        </html>
      `;

      newWin.document.open();
      newWin.document.write(content);
      newWin.document.close();
    }
  </script>
